name: Deploy

on:
  push:
    branches:
      - 'main'

jobs:
  AWS_Provision:
    runs-on: ubuntu-latest

    name: aws_provision

    permissions:
      id-token: write
      contents: write

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::260932761409:role/pipeline
          aws-region: eu-west-2

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      # https://github.com/actions/runner-images/issues/10796
      # terraform not included in ubuntu-latest
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "^1.3.7"
          terraform_wrapper: false

      - name: Install dependencies
        run: |
          npm install
          cd ./application
          npm install
          cd ..

      - name: Build dist
        run: |
          cd ./application
          npm run build
          cd ..

      - name: Deploy changes
        run: npm run replace_prod_files
